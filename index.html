<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHASSI - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- CABEÇALHO -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">CHASSI - CRM</h1>
        <nav id="nav-actions" class="hidden space-x-4">
            <button onclick="mostrarTela('tela-formulario')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold focus:ring-2 focus:ring-white">Novo Chamado</button>
            <button onclick="mostrarTela('tela-kanban')" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded text-sm font-semibold focus:ring-2 focus:ring-white">Ver Backlog</button>
        </nav>
    </header>

    <main class="container mx-auto p-6 max-w-4xl">

        <!-- TELA 1: LOGIN -->
        <section id="tela-login" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-12">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Login — CHASSI - CRM</h2>
            <form onsubmit="realizarLogin(event)" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail Corporativo</label>
                    <input type="email" id="email" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="gestor.operacoes@empresa.com">
                </div>
                <div>
                    <label for="senha" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="senha" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-lg font-semibold focus:ring-2 focus:ring-slate-500 h-[44px]">Entrar</button>
            </form>
        </section>

        <!-- TELA 2: FORMULÁRIO E CÁLCULO RICE -->
        <section id="tela-formulario" class="hidden bg-white p-8 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Abertura de Solicitação Operacional</h2>
            <form onsubmit="cadastrarChamado(event)" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="md:col-span-2 space-y-4">
                    <div>
                        <label for="titulo" class="block text-sm font-medium text-slate-700 mb-1">Título da Solicitação</label>
                        <input type="text" id="titulo" required class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label for="descricao" class="block text-sm font-medium text-slate-700 mb-1">Descrição Detalhada</label>
                        <textarea id="descricao" rows="3" required class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-600"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="alcance" class="block text-sm font-medium text-slate-700 mb-1">Alcance (Reach)</label>
                            <input type="number" id="alcance" value="500" oninput="calcularPreviewRICE()" required class="w-full border border-slate-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label for="impacto" class="block text-sm font-medium text-slate-700 mb-1">Impacto (0.5 a 3.0)</label>
                            <input type="number" step="0.5" id="impacto" value="3.0" oninput="calcularPreviewRICE()" required class="w-full border border-slate-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label for="confianca" class="block text-sm font-medium text-slate-700 mb-1">Confiança (%)</label>
                            <input type="number" id="confianca" value="80" oninput="calcularPreviewRICE()" required class="w-full border border-slate-300 rounded px-3 py-2">
                        </div>
                        <div>
                            <label for="esforco" class="block text-sm font-medium text-slate-700 mb-1">Esforço (Semanas)</label>
                            <input type="number" step="0.5" id="esforco" value="2.0" oninput="calcularPreviewRICE()" required class="w-full border border-slate-300 rounded px-3 py-2">
                        </div>
                    </div>
                </div>

                <!-- Painel de Preview -->
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 flex flex-col justify-between items-center text-center">
                    <div>
                        <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Score RICE Preview</span>
                        <div id="score-preview" class="text-4xl font-extrabold text-blue-600 my-4">600.0</div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold focus:ring-2 focus:ring-blue-400 h-[44px]">Calcular e Enviar</button>
                </div>
            </form>
        </section>

        <!-- TELA 3: QUADRO KANBAN PRIORIZADO -->
        <section id="tela-kanban" class="hidden">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Backlog Priorizado</h2>
            <div id="lista-chamados" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Os cartões serão inseridos dinamicamente aqui -->
            </div>
        </section>

    </main>

    <script>
        const API_URL = "http://localhost:8000";

        function mostrarTela(idTela) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(idTela).classList.remove('hidden');
            if (idTela === 'tela-kanban') carregarBacklog();
        }

        function realizarLogin(e) {
            e.preventDefault();
            document.getElementById('nav-actions').classList.remove('hidden');
            mostrarTela('tela-kanban');
        }

        function calcularPreviewRICE() {
            const a = parseFloat(document.getElementById('alcance').value) || 0;
            const i = parseFloat(document.getElementById('impacto').value) || 0;
            const c = (parseFloat(document.getElementById('confianca').value) || 0) / 100;
            const e = parseFloat(document.getElementById('esforco').value) || 1;
            
            const score = e > 0 ? ((a * i * c) / e).toFixed(1) : 0;
            document.getElementById('score-preview').innerText = score;
        }

        async function cadastrarChamado(e) {
            e.preventDefault();
            const payload = {
                titulo: document.getElementById('titulo').value,
                descricao: document.getElementById('descricao').value,
                alcance: parseFloat(document.getElementById('alcance').value),
                impacto: parseFloat(document.getElementById('impacto').value),
                confianca: parseFloat(document.getElementById('confianca').value),
                esforco: parseFloat(document.getElementById('esforco').value)
            };

            await fetch(`${API_URL}/chamados`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            mostrarTela('tela-kanban');
        }

        async function carregarBacklog() {
            const res = await fetch(`${API_URL}/chamados`);
            const chamados = await res.json();
            const container = document.getElementById('lista-chamados');
            container.innerHTML = '';

            chamados.forEach(c => {
                const badgeColor = c.status === 'Concluído' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded">Score: ${c.score_rice}</span>
                                <span class="${badgeColor} text-xs font-semibold px-2.5 py-1 rounded flex items-center gap-1">
                                    ● ${c.status}
                                </span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-lg mb-1">${c.titulo}</h3>
                            <p class="text-sm text-slate-600 mb-4">${c.descricao}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
